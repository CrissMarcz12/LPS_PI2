services:
  - type: web
    name: rimaymaki
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --bind 0.0.0.0:$PORT main:app
    envVars:
      - key: RIMAYMAKI_DATA_DIR
        value: /var/data
      - key: SECRET_KEY
        generateValue: true
    disk:
      name: rimaymaki-data
      mountPath: /var/data
      sizeGB: 1
