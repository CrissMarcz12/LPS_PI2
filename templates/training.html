<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RimayMaki | Entrenamiento</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body class="training-page"><header class="topbar"><a href="/" class="logo"><span class="logo-mark">RM</span><span>RIMAY<span class="logo-accent">MAKI</span></span></a><div class="session-progress">PANEL DE DESARROLLO</div></header>
<main class="training-layout"><section class="camera-panel"><div class="panel-heading"><div><p class="eyebrow">ENTRENAMIENTO DEL MODELO</p><h1>Captura muestras reales</h1></div><div class="camera-status"><span id="training-dot"></span><span id="training-camera-status">Cámara detenida</span></div></div><div class="camera-stage"><video id="training-camera" autoplay muted playsinline></video><canvas id="training-landmarks"></canvas><canvas id="training-capture" class="hidden"></canvas><div id="training-message" class="camera-message">Selecciona una letra y comienza la captura.</div></div><div class="training-status"><span id="training-hand">Esperando una mano</span><strong id="training-count">0 / 20 muestras</strong></div><div class="training-preview">Predicción actual: <strong id="training-prediction">—</strong><span id="training-confidence"></span></div></section>
<aside class="training-controls"><section class="target-card"><p class="eyebrow">LETRA ACTUAL</p><select id="training-letter" aria-label="Letra a entrenar"></select><p class="target-caption">Cada muestra usa 20 frames de landmarks normalizados.</p></section><section class="training-actions"><button id="capture-toggle" class="button primary">● CAPTURAR MUESTRAS</button><button id="stop-capture" class="button secondary">DETENER</button><button id="train-model" class="button secondary">ENTRENAR MODELO</button><button id="clear-samples" class="text-button">BORRAR MUESTRAS DE ESTA LETRA</button><p id="training-notice" role="status"></p></section><section class="score-card"><p class="eyebrow">MUESTRAS DISPONIBLES</p><div id="letter-counts" class="letter-counts"></div></section></aside></main><script type="module" src="{{ url_for('static', filename='js/training.js') }}"></script></body></html>
