<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RimayMaki | Podio</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}?v=1">
</head>
<body>
  <main class="dashboard-shell">
    <header class="dashboard-header"><a href="/game" class="back">← VOLVER AL JUEGO</a><div><p>RIMAYMAKI</p><h1>🏆 Podio de aventureros</h1></div><button id="refresh" type="button">↻ ACTUALIZAR</button></header>
    <p class="dashboard-copy">Las estrellas y rachas se guardan al terminar cada actividad.</p>
    <section id="podium" class="podium" aria-label="Podio de jugadores"></section>
    <section class="ranking-card"><h2>Ranking general</h2><div id="ranking" class="ranking" aria-live="polite"></div></section>
  </main>
  <script type="module">
    const podium = document.querySelector('#podium');
    const ranking = document.querySelector('#ranking');
    const medals = ['🥇', '🥈', '🥉', '🏅'];
    const escape = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
    const lastPlayed = value => value ? new Intl.DateTimeFormat('es-PE', {dateStyle: 'medium', timeStyle: 'short'}).format(new Date(value)) : 'aún no juega';
    function draw(players) {
      const ordered = [...players].sort((a, b) => a.position - b.position);
      podium.innerHTML = ordered.slice(0, 3).map(player => `<article class="podium-player theme-${escape(player.theme)} place-${player.position}"><span class="medal">${medals[player.position - 1]}</span><span class="avatar">${escape(player.avatar)}</span><strong>${escape(player.name)}</strong><b>${player.totalScore} ⭐</b><small>Racha máxima: ${player.maxStreak} 🔥</small></article>`).join('');
      ranking.innerHTML = ordered.map(player => `<article class="rank-row theme-${escape(player.theme)}"><span class="rank-number">${medals[player.position - 1] || '#' + player.position}</span><span class="rank-avatar">${escape(player.avatar)}</span><span class="rank-name"><b>${escape(player.name)}</b><small>${player.gamesPlayed} partidas · ${lastPlayed(player.lastPlayedAt)}</small></span><strong>${player.totalScore} <small>⭐</small></strong><em>🔥 ${player.maxStreak}</em></article>`).join('');
    }
    async function load() { const response = await fetch('/api/profiles'); const data = await response.json(); draw(data.profiles || []); }
    document.querySelector('#refresh').addEventListener('click', load); load();
  </script>
</body>
</html>
